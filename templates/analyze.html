{% extends "base.html" %} {% block content %}
<section id="analyze" class="upload-section py-5">
  <div class="container">
    <div class="text-center mb-5">
      <span class="hero-badge"> Resume Analysis </span>

      <h2 class="display-5 fw-bold mt-3">Ready to Analyze Your Resume?</h2>

      <p class="text-muted">
        Upload your resume and paste the target job description to receive an
        ATS compatibility report.
      </p>
    </div>

    <form action="/match" method="POST" enctype="multipart/form-data">
      <div class="row g-4">
        <div class="col-lg-5">
          <label class="upload-box" for="resume">
            <i class="bi bi-cloud-arrow-up-fill upload-icon"></i>

            <h4>Drop Resume Here</h4>

            <p>or click to browse</p>

            <small> PDF • DOCX </small>

            <input
              type="file"
              id="resume"
              name="resume"
              accept=".pdf,.doc,.docx"
              hidden
              required
            />
          </label>

          <div id="selected-file" class="selected-file">No file selected</div>

          <button
            type="button"
            id="remove-file"
            class="btn btn-sm btn-outline-danger mt-3"
            style="display: none"
          >
            Remove File
          </button>
        </div>

        <div class="col-lg-7">
          <label class="form-label fw-semibold"> Job Description </label>

          <textarea
            class="form-control"
            name="job_description"
            rows="10"
            placeholder="Paste the complete job description here..."
            required
          ></textarea>

          <button class="btn hero-btn mt-4 w-100" type="submit">
            Analyze Resume
          </button>
        </div>
      </div>
    </form>
  </div>
</section>

{% endblock %}
